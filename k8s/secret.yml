# Секрет с параметрами подключения к базе.
# В реальном проекте так хранить пароли нельзя — для этого есть Vault
# или Sealed Secrets (Ozon, например, использует Vault).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
stringData:
  database-url: postgresql://helpdesk:helpdesk@postgres:5432/helpdesk
